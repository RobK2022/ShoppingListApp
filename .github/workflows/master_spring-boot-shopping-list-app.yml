name: Build and deploy Docker image to Azure Web App - Spring-boot-shopping-list-app

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/spring-boot-app:${{ github.sha }} .
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/spring-boot-app:${{ github.sha }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Spring-boot-shopping-list-app'
          slot-name: 'Production'
          images: '${{ secrets.REGISTRY_LOGIN_SERVER }}/spring-boot-app:${{ github.sha }}'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_FEAE514F4BA54B2C80CECC02B9EB6B68 }}