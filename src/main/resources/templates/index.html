<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Shopping List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-success">
<div class="container mt-5" style="max-width: 600px;">
  <h2 class="mb-4 text-center">Shopping List</h2>

  <!-- Input Form -->
  <form th:action="@{/add}" th:object="${newItem}" method="post" class="row g-2 mb-4">
    <div class="col-7">
      <input type="text" th:field="*{name}" class="form-control" placeholder="Item name" required>
    </div>
    <div class="col-3">
      <input type="number" th:field="*{quantity}" class="form-control" value="1" min="1" required>
    </div>
    <div class="col-2">
      <button type="submit" class="btn btn-primary w-100">Add</button>
    </div>
  </form>

  <!-- List -->
  <ul class="list-group">
    <li th:each="item : ${items}"
        class="list-group-item d-flex justify-content-between align-items-center">

      <div>
        <a th:href="@{/toggle/{id}(id=${item.id})}" class="text-decoration-none">
                        <span th:classappend="${item.completed} ? 'text-decoration-line-through text-muted' : 'fw-bold text-dark'"
                              th:text="${item.name}">
                            Item
                        </span>
        </a>
        <span class="badge bg-secondary rounded-pill ms-2" th:text="'x' + ${item.quantity}">x1</span>
      </div>

      <a th:href="@{/delete/{id}(id=${item.id})}" class="btn btn-sm btn-outline-danger">Delete</a>
    </li>
  </ul>
</div>
</body>
</html>
